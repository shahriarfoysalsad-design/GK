
<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="icon" type="image/jpg" 
    href="4fae10a7-0439-41e3-97ae-6c8865f118c3.jpg">
    <link rel="manifest" 
    href="4fae10a7-0439-41e3-97ae-6c8865f118c3.jpg">
    <meta name="theme-color" content="#0b1020">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#081226">
<title>SFS QR - QR Code Creator</title>
<link rel="icon" href="4fae10a7-0439-41e3-97ae-6c8865f118c3.jpg">

<style>
*{box-sizing:border-box}
body{
 margin:0;padding:20px;font-family:Arial,sans-serif;
 background:linear-gradient(145deg,#061020,#15274a);
 color:#fff;min-height:100vh
}
.container{max-width:520px;margin:auto}
header{text-align:center;padding:12px 0 20px}
.logo{
 width:70px;height:70px;display:flex;align-items:center;
 justify-content:center;margin:auto;border-radius:20px;
 font-size:27px;font-weight:bold;color:white;
 background:linear-gradient(135deg,#00d9ff,#713cff);
 box-shadow:0 0 25px #00d9ff44
}
h1{color:#3bdcff;margin-bottom:5px}
.subtitle{color:#b9c9e0;font-size:14px}
.card{
 background:#111e35;border:1px solid #2a4265;
 padding:20px;border-radius:20px;margin-bottom:18px
}
label{display:block;margin:14px 0 7px;font-size:14px}
input,textarea{
 width:100%;padding:13px;border-radius:10px;
 border:1px solid #354c6d;background:#081226;
 color:white;font-size:16px;outline:none
}
textarea{resize:vertical;min-height:90px}
input:focus,textarea:focus{border-color:#28d8ff}
button{
 width:100%;padding:14px;margin-top:12px;
 border:0;border-radius:12px;font-size:15px;
 font-weight:bold;cursor:pointer
}
.primary{
 background:linear-gradient(90deg,#00d9ff,#6875ff);
 color:#071226
}
.secondary{background:#243957;color:white}
#result{text-align:center;display:none}
#qrArea{
 display:inline-block;background:white;padding:12px;
 border-radius:10px;margin:15px auto;max-width:100%
}
#qrArea canvas,#qrArea img{
 display:block;max-width:100%;height:auto
}
#status{color:#9ceaff;font-size:13px;line-height:1.6}
#details{display:none;overflow-wrap:anywhere}
#details a{color:#43dfff}
.footer{text-align:center;color:#8fa4c2;font-size:12px;padding:15px}
</style>
</head>

<body>
<div class="container">

<header>
 <div class="logo">SFS</div>
 <h1>SFS QR</h1>
 <div class="subtitle">Create • Scan • Save your QR code</div>
</header>

<section class="card" id="formCard">
 <label for="name">Name</label>
 <input id="name" placeholder="Enter your name">

 <label for="address">Address</label>
 <input id="address" placeholder="Enter your address">

 <label for="link">Website / Profile Link</label>
 <input id="link" type="url" placeholder="https://example.com">

 <label for="description">Description</label>
 <textarea id="description" placeholder="Write details here"></textarea>

 <button class="primary" onclick="generateQR()">Generate QR Code</button>
</section>


<button class="secondary" onclick="clearQR()">🗑️ Clear All</button>


<section class="card" id="result">
 <h2>Your QR Code</h2>
 <div id="qrArea"></div>

 <button class="primary" onclick="saveQRToGallery()">
  📷 Save to Gallery (JPG)
 </button>

 <button class="secondary" onclick="shareQR()">
  Share QR Image
 </button>

 <button class="secondary" onclick="copyQRLink()">
  Copy QR Link
 </button>

 <p id="status"></p>
</section>

<section class="card" id="details">
 <h2 id="detailName">QR Details</h2>
 <p id="detailAddress"></p>
 <p id="detailDescription"></p>
 <p id="detailLink"></p>
</section>

<div class="footer">SFS QR • Made with care</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
let currentQRLink = "";

function generateQR(){
 const data = {
  name:document.getElementById("name").value.trim(),
  address:document.getElementById("address").value.trim(),
  link:document.getElementById("link").value.trim(),
  description:document.getElementById("description").value.trim()
 };

 if(!data.name && !data.address && !data.link && !data.description){
  alert("Please enter some information first.");
  return;
 }

 if(data.link){
  try{
   const u = new URL(data.link);
   if(!["http:","https:"].includes(u.protocol)) throw Error();
  }catch(e){
   alert("Enter a valid link starting with https:// or http://");
   return;
  }
 }

 const url = new URL("./index.html",window.location.href);
 url.searchParams.set("data",JSON.stringify(data));
 currentQRLink = url.href;

 const area = document.getElementById("qrArea");
 area.innerHTML = "";
 document.getElementById("result").style.display = "block";

 new QRCode(area,{
  text:currentQRLink,
  width:280,
  height:280,
  colorDark:"#081226",
  colorLight:"#ffffff",
  correctLevel:QRCode.CorrectLevel.M
 });

 document.getElementById("status").textContent =
  "QR code ready. You can save it as a JPG image.";

 document.getElementById("result").scrollIntoView({behavior:"smooth"});
}

function makeJPG(){
 return new Promise((resolve,reject)=>{
  const area = document.getElementById("qrArea");
  const source = area.querySelector("canvas") || area.querySelector("img");

  if(!source){
   reject(new Error("Generate a QR code first."));
   return;
  }

  const width = source.naturalWidth || source.width;
  const height = source.naturalHeight || source.height;
  const padding = 30;
  const canvas = document.createElement("canvas");

  canvas.width = width + padding*2;
  canvas.height = height + padding*2;

  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(source,padding,padding,width,height);

  canvas.toBlob(blob=>{
   if(blob) resolve(blob);
   else reject(new Error("JPG creation failed."));
  },"image/jpeg",0.95);
 });
}

async function saveQRToGallery(){
 if(!currentQRLink){
  alert("Please generate a QR code first.");
  return;
 }

 const status = document.getElementById("status");

 try{
  const blob = await makeJPG();
  const file = new File([blob],"SFS-QR.jpg",{type:"image/jpeg"});

  // Open Android's share sheet where supported.
  if(navigator.share && navigator.canShare &&
     navigator.canShare({files:[file]})){
   await navigator.share({
    files:[file],
    title:"SFS QR",
    text:"SFS QR Code"
   });
   status.textContent =
    "Choose a save option in the share menu if available.";
  }else{
   // Browser fallback: save the JPG to Downloads.
   const objectURL = URL.createObjectURL(blob);
   const a = document.createElement("a");
   a.href = objectURL;
   a.download = "SFS-QR.jpg";
   document.body.appendChild(a);
   a.click();
   a.remove();

   status.textContent =
    "JPG save started. Check your Downloads folder.";
   setTimeout(()=>URL.revokeObjectURL(objectURL),60000);
  }
 }catch(error){
  if(error.name==="AbortError"){
   status.textContent="Save cancelled.";
  }else{
   status.textContent="Could not save the JPG. Please try again.";
  }
 }
}

async function shareQR(){
 if(!currentQRLink){
  alert("Generate a QR code first.");
  return;
 }

 try{
  const blob = await makeJPG();
  const file = new File([blob],"SFS-QR.jpg",{type:"image/jpeg"});

  if(navigator.share && navigator.canShare &&
     navigator.canShare({files:[file]})){
   await navigator.share({files:[file],title:"SFS QR"});
  }else{
   await copyQRLink();
  }
 }catch(error){
  if(error.name!=="AbortError") alert("Unable to share QR image.");
 }
}

async function copyQRLink(){
 if(!currentQRLink){
  alert("Generate a QR code first.");
  return;
 }

 try{
  await navigator.clipboard.writeText(currentQRLink);
  alert("QR link copied successfully!");
 }catch(error){
  prompt("Copy your QR link:",currentQRLink);
 }
}

function showDetails(data){
 document.getElementById("formCard").style.display="none";
 document.getElementById("result").style.display="none";
 document.getElementById("details").style.display="block";

 document.getElementById("detailName").textContent=data.name||"QR Details";
 document.getElementById("detailAddress").textContent=
  data.address ? "Address: "+data.address : "";
 document.getElementById("detailDescription").textContent=
  data.description ? "Description: "+data.description : "";

 const linkArea=document.getElementById("detailLink");
 linkArea.replaceChildren();

 if(data.link){
  try{
   const u=new URL(data.link);
   if(["http:","https:"].includes(u.protocol)){
    const a=document.createElement("a");
    a.href=u.href;
    a.target="_blank";
    a.rel="noopener noreferrer";
    a.textContent="Open Website";
    linkArea.appendChild(a);
   }
  }catch(e){}
 }
}

// Display information when a QR link is opened.
(function(){
 const raw=new URLSearchParams(location.search).get("data");
 if(!raw) return;

 try{
  const data=JSON.parse(raw);
  if(data && typeof data==="object") showDetails(data);
 }catch(e){}
})();




function clearQR() {
  document.getElementById("name").value = "";
  document.getElementById("address").value = "";
  document.getElementById("link").value = "";
  document.getElementById("description").value = "";

  document.getElementById("qrArea").innerHTML = "";
  document.getElementById("result").style.display = "none";

  document.getElementById("status").textContent = "";
  currentQRLink = "";
}




</script>
</body>
</html>
