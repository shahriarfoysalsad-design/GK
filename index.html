<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
body{

header{

    color:white;
    text-align:center;
    padding:15px;
    font-size:28px;

}

#chat{

    background:white;

    overflow-y:auto;
    padding:10px;

}

.user{

    color:white;

    border-radius:10px;
    margin:8px 0;

}

.bot{
    background:#e5e5e5;
    color:black;
    padding:10px;
    border-radius:10px;
    margin:8px 0;
}

.inputBox{
    width:90%;
    max-width:600px;
    margin:auto;
    display:flex;
    gap:10px;
}

input{
    flex:1;
    padding:12px;
    font-size:16px;
}

button{
    padding:12px 20px;
    background:#0066ff;
    color:white;
    border:none;
    cursor:pointer;
}
</style>
</head>
