<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TalkBd</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f2f2f2;
}

header{
    background:#0066ff;
    color:white;
    text-align:center;
    padding:15px;
    font-size:28px;
    font-weight:bold;
}

#chat{
    width:90%;
    max-width:600px;
    height:400px;
    margin:20px auto;
    background:white;
    border-radius:10px;
    overflow-y:auto;
    padding:10px;
    box-shadow:0 0 10px rgba(0,0,0,.2);
}

.user{
    background:#0066ff;
    color:white;
    padding:10px;
    border-radius:10px;
    margin:8px 0;
    text-align:right;
}

.bot{
    background:#e5e5e5;
    color:black;
    padding:10px;
    border-radius:10px;
    margin:8px 0;
}

.inputBox{
    width:90%;
    max-width:600px;
    margin:auto;
    display:flex;
    gap:10px;
}

input{
    flex:1;
    padding:12px;
    font-size:16px;
}

button{
    padding:12px 20px;
    background:#0066ff;
    color:white;
    border:none;
    cursor:pointer;
}
</style>
</head>

<body>

<header>TalkBd</header>

<div id="chat">
<div class="bot"><b>TalkBd:</b>Ami ki vabe tomake help korte pari bolo!</div>
</div>

<div class="inputBox">
<input type="text" id="msg" placeholder="Type your message...">
<button onclick="send()">Send</button>
</div>

<script>

function send(){

let input=document.getElementById("msg");
let text=input.value.trim();

if(text=="") return;

let chat=document.getElementById("chat");

chat.innerHTML += "<div class='user'><b>You:</b> "+text+"</div>";

let reply="Hmm Bolo ami ki vabe tumake help korte pari . ami tumar satei achi.";

let t=text.toLowerCase();

if(t=="hi"||t=="hello"){
reply="Hello! Welcome to TalkBd.";
}
else if(t=="Kemon acho tumi"){
reply="Ami valo achi tumi kmn acho!";
}
else if(t=="Tmr name ki"){
reply="Amar name TalkBd.";
}






if(t.includes("hi") || t.includes("hello")){
    reply = "Hello! Welcome.";
}
else if(t.includes("name")){
    reply = "Amar name TalkBd.";
}
else if(t.includes("tumake ke made korise")){
    reply = "Amake banaise SFS jeta Shahriar Foysal Sad";
}
else if(t.includes("kemon acho tumi")){
    reply = "Ami valo achi tumi kmn acho.";
}
else if(t.includes("ohh") || t.includes("js")){
    reply = "Hmm.";
}

else if(t.includes("Amio valo achi") || t.includes("js")){
    reply = "ohh.";
}
else if(t.includes("hmm") || t.includes("js")){
    reply = "ok.";
}
else if(t.includes("tumi kothai thako") || t.includes("js")){
    reply = "online a.";
}
else if(t.includes("tumake made korise ke") || t.includes("js")){
    reply = "Shahriar Foysal Sad.";
}
else if(t.includes("banaise ke") || t.includes("js")){
    reply = "Shahriar Foysal Sad.";
}


else if(t.includes("Ki khobor")){
    reply = "Amr khobor valo tmr khobor ki";
}
else if(t.includes("valo")){
    reply = "ohh";
}
else if(t.includes("ki koro")){
    reply = "ami online a achi tmr sate bolo ki bolbe";
}
else if(t.includes("ke banaise tumak")){
    reply = "Shahriar Foysal Sad";
}
else if(t.includes("ok")){
    reply = "ok";
}



else if(t.includes("ki obostha tumar")){
    reply = "Valo";
}
else if(t.includes("Accha pore kotha hobe ni")){
    reply = "okk";
}










else if(t=="time"){
reply=new Date().toLocaleTimeString();
}
else if(t=="date"){
reply=new Date().toLocaleDateString();
}
else if(t=="bye"){
reply="Goodbye! Have a nice day.";
}

chat.innerHTML += "<div class='bot'><b>TalkBd:</b> "+reply+"</div>";

input.value="";
chat.scrollTop=chat.scrollHeight;

}

document.getElementById("msg").addEventListener("keypress",function(e){
if(e.key==="Enter"){
send();
}
});

</script>

</body>
</html>
